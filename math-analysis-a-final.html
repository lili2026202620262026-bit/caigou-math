{g:'选择题',q:'设 \\(\\lim_{n\\to\\infty}a_n=a\\ne0\\)，则当 \\(n\\) 充分大时（ ）',opt:'A. \\(|a_n|>|a|/2\\)\\nB. \\(|a_n|<|a|/2\\)\\nC. \\(a_n>a-1/n\\)\\nD. \\(a_n<a+1/n\\)',a:'A',p:'数列极限的 \\(\\varepsilon\\) 定义与绝对值估计',l:'关键是利用极限把 \\(a_n\\) 限制在以非零 \\(a\\) 为中心的小邻域中；只要邻域半径小于 \\(|a|\\)，数列项就不会靠近零。',s:[['选取误差','因为 \\(a\\ne0\\)，\\(|a|/2>0\\)，可在极限定义中取 \\(\\varepsilon=|a|/2\\)。'],['套用定义','存在 \\(N\\)，当 \\(n>N\\) 时有 \\(|a_n-a|<|a|/2\\)。'],['反向三角不等式','由 \\(|a_n|\\ge |a|-|a_n-a|\\)，把上一不等式代入。','\\[|a_n|>|a|-\\frac{|a|}{2}=\\frac{|a|}{2}.\\]'],['排除单侧说法','收敛可以从两侧发生，不能保证 \\(a_n\\) 必在 \\(a\\) 的某一侧；故只有 A 是必然结论。']],c:'充分大时 \\(|a_n|>|a|/2\\)。'},
{g:'选择题',q:'设 \\(f(x)=(e^x-1)(e^{2x}-2)\\cdots(e^{nx}-n)\\)，则 \\(f\\prime(0)=\\)',opt:'A. \\((-1)^{n-1}n!\\)\\nB. \\((-1)^{n-1}(n-1)!\\)\\nC. \\((-1)^n(n-1)!\\)\\nD. \\((-1)^nn!\\)',a:'B',p:'乘积函数在零点的导数',l:'先找出哪个因子在零点取零值。乘积求导后，含有该零因子的其余项全部消失。',s:[['定位零因子','\\(e^0-1=0\\)，而对 \\(k\\ge2\\)，\\(e^{k\\cdot0}-k=1-k\\ne0\\)。'],['应用乘积求导','只有对第一因子求导的项不含 \\(e^x-1\\)，因此可直接在零点代入。','\\[f\\prime(0)=e^0\\prod_{k=2}^n(1-k).\\]'],['整理乘积','\\(1-k=-(k-1)\\)，共有 \\(n-1\\) 个负号，正数部分为 \\(1\\cdot2\\cdots(n-1)\\)。','\\[f\\prime(0)=(-1)^{n-1}(n-1)!.\\]'],['核对选项','所得表达式与 B 一致。']],c:'导数为 \\((-1)^{n-1}(n-1)!\\)。'},

{g:'计算题',q:'求 \\(\\displaystyle\\lim_{x\\to0}\\frac{\\sin x e^{x^2}-x(1+x^2)}{\\sin^3x}\\)。',opt:'',a:'\\(-1/6\\)',p:'三阶泰勒展开',l:'分母是三阶小量，分子要精确保留到三次项；只保留一阶项会丢失决定极限的系数。',s:[['展开正弦','在零点附近 \\(\\sin x=x-x^3/6+o(x^3)\\)。'],['展开指数','\\(e^{x^2}=1+x^2+o(x^2)\\)，因为与 \\(\\sin x\\) 相乘，只需保留到 \\(x^2\\)。'],['相乘并作差','把两式相乘：\\(\\sin x e^{x^2}=x+5x^3/6+o(x^3)\\)，再减去 \\(x(1+x^2)\\)。','\\[\\sin x e^{x^2}-x(1+x^2)=-\\frac{x^3}{6}+o(x^3).\\]'],['比较分母','\\(\\sin^3x=x^3+o(x^3)\\)，约去共同的三次主项。','\\[\\lim_{x\\to0}\\frac{-x^3/6+o(x^3)}{x^3+o(x^3)}=-\\frac16.\\]']],c:'所求极限为 \\(-1/6\\)。'},
