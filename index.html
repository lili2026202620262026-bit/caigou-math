<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>菜狗捞捞 · 数学分析 B 题库</title>
  <style>
    :root{--ink:#18392b;--muted:#719081;--line:#dceade;--bg:#f5faf3;--mint:#dff3dc;--green:#74b96d;--deep:#3d7e4d;--yellow:#fff1a8;}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--bg);font-family:"Noto Sans SC",sans-serif} button{font:inherit;cursor:pointer}
    .topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 7.2vw;border-bottom:1px solid #e7f0e6;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.brand b{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50% 50% 47% 47%;background:#bfe56f;color:#fff;margin-right:9px;font-size:14px}.term{font-size:13px;color:var(--muted);padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:#fff}
    main{max-width:1120px;margin:auto;padding:58px 24px 160px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;margin-bottom:42px}.eyebrow{font:700 13px "DM Mono",monospace;color:var(--deep);letter-spacing:.6px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.15;margin:14px 0 17px;letter-spacing:-3px}.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,#d5f1a8 0)}.lead{font-size:16px;line-height:1.9;color:#557264;max-width:575px}.hero-card{background:var(--mint);border-radius:26px;padding:26px;border:1px solid #cbe7c7;align-self:end;position:relative;overflow:hidden}.hero-card:after{content:"期中周";position:absolute;right:-12px;bottom:-20px;font-size:72px;font-weight:800;color:#c7e8c3;letter-spacing:-8px}.hero-card strong{font-size:23px;display:block;margin-bottom:7px}.hero-card p{color:#517559;margin:0;line-height:1.7;position:relative;z-index:1}.progress{height:7px;background:#fff;border-radius:10px;margin-top:20px;overflow:hidden;position:relative;z-index:1}.progress i{display:block;width:0;height:100%;background:var(--green);transition:.5s}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 15px}.toolbar h2{margin:0;font-size:20px}.count{font:13px "DM Mono",monospace;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;color:#587262;border-radius:99px;padding:7px 14px;font-size:13px}.filter.active{background:var(--ink);border-color:var(--ink);color:white}
    .questions{display:grid;gap:13px}.question{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px 24px;transition:.25s}.question.done{border-color:#b8dfb2;background:#fdfffc}.q-head{display:flex;gap:15px;align-items:flex-start}.num{flex:none;width:32px;height:32px;border-radius:10px;background:#eff8ed;color:var(--deep);font:700 13px "DM Mono",monospace;display:grid;place-items:center}.q-title{font-size:16px;line-height:1.7;font-weight:600;flex:1;padding-top:2px}.tag{font-size:12px;color:#668273;background:#f5f9f4;border-radius:6px;padding:4px 8px;white-space:nowrap}.answer-zone{padding-left:47px;margin-top:14px}.options{display:flex;gap:9px;flex-wrap:wrap}.option{min-width:76px;text-align:left;border:1px solid #dbe8dc;background:#fff;border-radius:9px;padding:9px 11px;color:#395746;font-size:14px}.option:hover{border-color:var(--green);background:#f5fcf1}.option.selected{background:#e1f3dd;border-color:#76b76e}.text-answer{width:100%;min-height:74px;border:1px solid #dbe8dc;border-radius:10px;padding:12px;color:var(--ink);resize:vertical;font:14px/1.6 "Noto Sans SC"}.text-answer:focus{outline:2px solid #d9efd5;border-color:var(--green)}.actions{display:flex;align-items:center;gap:10px;margin-top:12px}.submit{border:0;background:var(--ink);color:white;border-radius:9px;padding:9px 14px;font-size:13px}.reveal{border:0;background:transparent;color:var(--deep);font-weight:600;font-size:13px;padding:8px}.result{margin-top:14px;border-radius:11px;background:#f5fbf3;border:1px solid #dbedd8;padding:14px 15px;display:none}.result.show{display:block}.result strong{font-size:14px}.result p{color:#537260;line-height:1.75;margin:7px 0 0;font-size:14px}.analysis{margin-top:11px;padding-top:11px;border-top:1px dashed #cde1ca}.analysis b{color:var(--deep)}
    .pet{--offset:0%;position:fixed;right:18px;bottom:16px;width:158px;z-index:8;filter:drop-shadow(0 10px 13px rgba(58,102,66,.15));user-select:none}.pet-bubble{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:13px;padding:8px 10px;font-size:11px;line-height:1.45;position:absolute;left:50%;top:-36px;width:142px;transform:translateX(-50%);text-align:center;box-shadow:0 7px 18px rgba(44,83,54,.08)}.pet-bubble:after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}.pet-stage{position:absolute;right:2px;top:3px;z-index:2;border:1px solid #cfe5ca;background:#f8fff5;color:#4d8152;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800;box-shadow:0 3px 9px rgba(70,110,71,.09)}.sprite-frame{height:153px;width:158px;overflow:hidden;position:relative}.sprite{position:absolute;width:400%;max-width:none;height:auto;left:0;bottom:-25px;transform:translateX(var(--offset));transition:transform .55s cubic-bezier(.22,.8,.25,1);will-change:transform}.pet.celebrate .sprite-frame{animation:bounce .65s ease infinite alternate}.pet-label{margin-top:-6px;text-align:center;font:700 11px "DM Mono",monospace;color:#578265;background:rgba(245,250,243,.88);border-radius:99px;padding:4px 7px}@keyframes bounce{to{transform:translateY(-7px) rotate(-1.5deg)}} 
    @media(max-width:720px){.topbar{padding:0 20px}.term{display:none}main{padding:35px 18px 160px}.hero{grid-template-columns:1fr}.hero h1{letter-spacing:-2px}.q-head{gap:10px}.answer-zone{padding-left:0}.tag{display:none}.pet{right:8px;bottom:10px;width:132px}.sprite-frame{width:132px;height:128px}.sprite{bottom:-20px}.pet-bubble{width:126px;top:-39px;font-size:10px}.hero-card{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><b>菜</b>菜狗捞捞</div><div class="term">2025 秋季 · 数学分析 B</div></header>
  <main>
    <section class="hero"><div><div class="eyebrow">MATH ANALYSIS · MIDTERM SURVIVAL KIT</div><h1>先做题，<em>再捞菜狗。</em></h1><p class="lead">来自 2025 年秋季数学分析 B 的期中题库。每题先独立作答；卡住时再打开答案与考点解析。答完一题，右下角的菜狗就离岸边更近一点。</p></div><aside class="hero-card"><strong id="hero-status">菜狗正在努力露头</strong><p id="hero-copy">完成一题，水位下降一格。不要让它在极限里无限下沉。</p><div class="progress"><i id="bar"></i></div></aside></section>
    <div class="toolbar"><h2>试卷题库 <span class="count" id="counter">0 / 10 已作答</span></h2><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="choice">选择题</button><button class="filter" data-filter="proof">解答题</button></div></div>
    <section class="questions" id="questions"></section>
  </main>
  <aside class="pet" id="pet">
    <div class="pet-bubble" id="pet-text">捞捞……先拿下一题！</div>
    <div class="pet-stage" id="pet-stage">捞捞</div>
    <div class="sprite-frame"><img class="sprite" src="assets/caigou-drowning-states.png" alt="随答题进度获救的菜狗"></div>
    <div class="pet-label" id="pet-label">溺水中 · 0 / 10</div>
  </aside>
  <script>
  const data=[
    {type:'choice',tag:'数列极限',q:'下列说法正确的是（ ）',opts:['{aₙ} 收敛的充要条件是 {a₂ₙ₋₁} 和 {a₂ₙ} 收敛且极限相等','单调递减有界数列必有下确界，反之成立','∀ε>0，若无穷多个 |xₙ|<ε，则 {xₙ} 为无穷小数列','limₙ→∞ 1/ⁿ√n! = +∞'],ans:0,point:'数列收敛的子列判别与无穷小定义',explain:'若奇、偶子列均收敛且极限相等，则原数列收敛。B 的逆命题不成立；C 只说明有子列趋零；D 的极限为 1。'},
    {type:'choice',tag:'无穷小',q:'当 x → 0 时，(1/x²) sin(1/x) 是（ ）',opts:['无穷小','有界的，不是无穷小','无穷大','无界，但不是无穷大'],ans:3,point:'函数极限与无界、无穷大的区分',explain:'取 xₙ=1/(π/2+2nπ) 时函数值为 1/xₙ²→∞；取 yₙ=1/(3π/2+2nπ) 时函数值为 −1/yₙ²→−∞，故无界但并非趋于 +∞。'},
    {type:'choice',tag:'等价无穷小',q:'当 x → 0，下列无穷小量中，和其他不是同阶的是（ ）',opts:['ln(1+x)','eˣ−1','tan x−sin x','1−cos x'],ans:2,point:'等价无穷小与泰勒展开',explain:'ln(1+x)∼x，eˣ−1∼x，1−cos x∼x²/2；而 tan x−sin x∼x³/2，阶数为 3，因此 C 与其余不同。'},
    {type:'choice',tag:'间断点',q:'f(x)=arctan(1/(1−x))，x=1 是（ ）间断点',opts:['可去','无穷','跳跃','振荡'],ans:2,point:'左右极限与间断点分类',explain:'x→1⁻ 时 1/(1−x)→+∞，函数趋于 π/2；x→1⁺ 时趋于 −∞，函数趋于 −π/2。左右极限有限但不相等，是跳跃间断点。'},
    {type:'choice',tag:'连续函数',q:'f(x)=x/(a+eᵇˣ) 在 ℝ 上连续，且 limₓ→−∞ f(x)=0，则下列说法正确的是（ ）',opts:['a<0,b<0','a≥0,b>0','a<0,b>0','a≥0,b<0'],ans:3,point:'连续性条件与无穷远处极限',explain:'为在 ℝ 上连续，分母恒不为零。结合 x→−∞ 的极限为 0，可得 b<0，且 a≥0；故选 D。'},
    {type:'proof',tag:'ε–δ 证明',q:'用定义证明：limₓ→₁ (x²−1)/(2x²−x−1)=2/3。',point:'函数极限的 ε–δ 定义；分母估计',explain:'化简得 |(x²−1)/(2x²−x−1)−2/3|=|x−1|/[3|2x+1|]。令 |x−1|<1，则 0<x<2，从而 |2x+1|>1，上式<|x−1|/3。取 δ=min{1,3ε} 即可。'},
    {type:'proof',tag:'柯西准则',q:'叙述柯西收敛准则；并用其证明 aₙ=1+1/2²+1/3²+…+1/n² 收敛。',point:'数列柯西收敛准则；裂项放缩',explain:'准则：∀ε>0，∃N，当 m,n>N 时 |aₘ−aₙ|<ε。若 m>n，则 |aₘ−aₙ|=Σₖ₌ₙ₊₁ᵐ1/k²<Σₖ₌ₙ₊₁ᵐ1/[k(k−1)]=1/n−1/m<1/n。取 N>[1/ε] 即得。'},
    {type:'proof',tag:'极限计算',q:'计算 limₓ→0⁺ [1−√(cos x)] / {x[1−cos√x]}。',point:'等价无穷小；复合函数极限',explain:'1−√(cos x)∼(1−cos x)/2∼x²/4；1−cos√x∼x/2。因此分母 x[1−cos√x]∼x²/2，极限为 1/2。'},
    {type:'proof',tag:'函数极限',q:'叙述函数极限的归结原则；证明极限 limₓ→∞ sin(1/x) 存在。',point:'归结原则；复合函数极限',explain:'若 u(x)→a，且 f(t) 在 t→a 时极限为 A，则 f(u(x))→A。这里 1/x→0，且 sin t→0，故 sin(1/x)→0，极限存在。'},
    {type:'proof',tag:'上确界',q:'设 S 为有界数集。证明：若 sup S=a∉S，则存在严格递增数列 {xₙ}⊂S，使 limₙ→∞xₙ=a。',point:'上确界定义；递推构造；夹逼准则',explain:'先取 a−1<x₁<a。递推时令 εₙ=min{1/n,a−xₙ₋₁}，由上确界定义取 xₙ∈S 使 a−εₙ<xₙ<a，于是 xₙ>xₙ₋₁ 且 a−1/n<xₙ<a。由夹逼定理 xₙ→a。'}
  ];
  const root=document.querySelector('#questions'), done=new Set(); let selected={};
  const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;');
  function draw(filter='all'){root.innerHTML=data.map((d,i)=>`<article class="question ${done.has(i)?'done':''}" data-type="${d.type}" ${filter!=='all'&&filter!==d.type?'hidden':''}><div class="q-head"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="q-title">${d.q}</div><span class="tag">${d.tag}</span></div><div class="answer-zone">${d.type==='choice'?`<div class="options">${d.opts.map((o,n)=>`<button class="option ${selected[i]===n?'selected':''}" onclick="pick(${i},${n})">${'ABCD'[n]} · ${esc(o)}</button>`).join('')}</div>`:`<textarea class="text-answer" placeholder="在这里写下你的证明或计算过程…" oninput="typed(${i},this.value)">${selected[i]||''}</textarea>`}<div class="actions"><button class="submit" onclick="submit(${i})">提交本题</button><button class="reveal" onclick="reveal(${i})">做不出来，查看答案 →</button></div><div class="result" id="result-${i}"><strong id="result-title-${i}"></strong><p><b>考点：</b>${d.point}</p><p class="analysis"><b>答案与解析：</b>${d.explain}</p></div></div></article>`).join('')}
  window.pick=(i,n)=>{selected[i]=n;draw(current)};window.typed=(i,v)=>selected[i]=v;
  window.submit=i=>{if(data[i].type==='choice'&&selected[i]===undefined){alert('先选择一个选项吧。');return}if(data[i].type==='proof'&&!selected[i]?.trim()){alert('先写下一点思路吧。');return}done.add(i);show(i,data[i].type==='choice'?(selected[i]===data[i].ans?'回答正确！菜狗上浮了一点。':'已记录作答。对照解析再捞一次菜狗吧。'):'已记录作答。对照解析补全证明。');sync();draw(current);show(i,data[i].type==='choice'?(selected[i]===data[i].ans?'回答正确！菜狗上浮了一点。':'已记录作答。对照解析再捞一次菜狗吧。'):'已记录作答。对照解析补全证明。')};window.reveal=i=>{show(i,'参考答案已展开。');};
  function show(i,title){let r=document.querySelector('#result-'+i);if(!r)return;r.classList.add('show');document.querySelector('#result-title-'+i).textContent=title}
  function sync(){let n=done.size,p=n/data.length,state=n===10?3:n>=6?2:n>=3?1:0,stage=n===10?'老师':n>=3?'菜菜':'捞捞';document.querySelector('#counter').textContent=`${n} / ${data.length} 已作答`;document.querySelector('#bar').style.width=(p*100)+'%';let label=n===10?'安全上岸 · 10 / 10':n>=6?'正在爬缸 · '+n+' / 10':n>=3?'努力上浮 · '+n+' / 10':'溺水求捞 · '+n+' / 10';document.querySelector('#pet-label').textContent=label;document.querySelector('#pet-stage').textContent=stage;document.querySelector('#pet-text').textContent=n===10?'老师！这次真的被捞出来啦！':n>=6?'看到岸了，再答几题！':n>=3?'菜菜正在努力上浮！':'捞捞……先拿下一题！';document.querySelector('#hero-status').textContent=n===10?'恭喜，菜狗安全上岸！':n?'菜狗正在上浮':'菜狗正在努力露头';document.querySelector('#hero-copy').textContent=n===10?'本套题已全部完成，期中周平安度过。':'完成一题，菜狗会进入新的获救状态。';let pet=document.querySelector('#pet');pet.style.setProperty('--offset',`${-state*25}%`);pet.classList.toggle('celebrate',n===10)}
  let current='all';document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{current=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));draw(current)});draw();sync();
  </script>
</body></html>
