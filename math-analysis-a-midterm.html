  <style>
    :root{--ink:#173a2b;--deep:#347047;--bg:#f6fbf4;--line:#d6e9d5;--muted:#688577}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,7vw);position:sticky;top:0;z-index:3;background:#fffffff0;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-weight:800;font-size:18px}.brand i{font-style:normal;display:inline-grid;place-items:center;width:25px;height:25px;margin-right:7px;border-radius:50%;background:#bfe576;color:white;font-size:12px}.sub{font-size:12px;color:var(--muted)}main{max-width:950px;margin:auto;padding:40px 18px 165px}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(120deg,#fff,#e7f6e3)}.eyebrow{font:700 11px monospace;color:var(--deep);letter-spacing:.7px}h1{font-size:clamp(28px,4.5vw,43px);letter-spacing:-1.7px;margin:9px 0}.hero p{max-width:640px;margin:0;line-height:1.75;color:#587566;font-size:14px}.score{flex:none;min-width:126px;padding:13px;text-align:center;border:1px solid #d8ead4;border-radius:15px;background:#fff}.score b{display:block;font-size:25px}.score span{font-size:11px;color:var(--muted)}.progress{margin:16px 0;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:14px}.phead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.phead b{color:var(--deep)}.track{height:7px;background:#e8f1e6;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#a7dc9d,#63ad71);border-radius:99px;transition:.35s}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#587566;background:#fff;cursor:pointer;font-size:13px}.tab.active{color:#fff;background:var(--ink);border-color:var(--ink)}.list{display:grid;gap:12px}.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.card.done{border-color:#99cb92}.head{display:flex;gap:11px;align-items:flex-start}.list,.card,.head,.q,.work,.sol{min-width:0}.num{width:31px;height:31px;display:grid;place-items:center;flex:none;background:#eaf7e7;color:var(--deep);border-radius:9px;font:800 12px monospace}.q{flex:1;font-weight:700;line-height:1.85;overflow-x:auto}.work{margin:14px 0 0 42px}.input{width:100%;min-height:43px;padding:10px 11px;color:var(--ink);border:1px solid #d5e6d5;border-radius:10px;outline:0;font:14px/1.6 inherit}.input:focus{border-color:#6db476;box-shadow:0 0 0 3px #e6f5e2}textarea.input{min-height:110px;resize:vertical}.actions{display:flex;gap:8px;margin-top:10px}.primary,.ghost{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px}.primary{background:var(--ink);color:white}.ghost{background:#eef8eb;color:var(--deep)}.sol{display:none;margin-top:12px;padding:13px;border:1px solid #cfe7ca;background:#f4fbf1;border-radius:12px;font-size:14px;line-height:1.85}.sol.show{display:block}.sol b{color:var(--deep)}.pet{position:fixed;right:12px;bottom:9px;width:128px;z-index:5;filter:drop-shadow(0 8px 12px #426b4933);user-select:none}.bubble{position:absolute;left:50%;top:-37px;transform:translateX(-50%);width:138px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-size:11px}.frame{height:122px;overflow:hidden;position:relative}.sprite{position:absolute;width:400%;max-width:none;left:0;bottom:-20px;transform:translateX(var(--x,0%));transition:.5s}.label{text-align:center;margin-top:-4px;padding:4px;border-radius:99px;background:#f6fbf4cc;color:#538060;font:700 10px monospace}@media(max-width:650px){.sub{display:none}main{padding:24px 12px 155px}.hero{display:block;padding:20px;border-radius:20px}.hero p{font-size:13px}.score{display:inline-block;margin-top:14px;text-align:left;min-width:0}.score b{display:inline;font-size:19px;margin-right:5px}.card{padding:15px}.work{margin-left:0}.pet{width:88px;right:3px}.frame{height:84px}.sprite{bottom:-14px}.bubble{width:102px;top:-34px;font-size:9px}}

<body>
  <header class="top"><div class="brand"><i>菜</i>菜狗捞捞</div><div class="sub">数学分析 A · 大一上期中</div></header>
  <main>
<section class="hero"><div><div class="eyebrow">FRESHMAN FALL · MATHEMATICAL ANALYSIS A · MIDTERM</div><h1>数学分析 A，<br>把菜狗捞上来。</h1><p>内容用于参考，不替代具体法律意见。</p></div><div class="score"><b id="score">0 / 7</b><span>已完成</span></div></section>
    <section class="progress"><div class="phead"><b id="pt">复习刚开始</b><span id="pc">0 / 7</span></div><div class="track"><i id="bar"></i></div></section>
    <nav class="tabs" id="tabs"></nav><section class="list" id="list"></section>
  </main>
  <aside class="pet"><div class="bubble" id="bubble">先从第一题开始吧！</div><div class="frame"><img class="sprite" id="sprite" src="assets/caigou-drowning-states.png" alt="随进度获救的菜狗"></div><div class="label" id="label">溺水中 · 0 / 7</div></aside>
  <script src="assets/caigou-rich-solutions.js"></script>
  <script src="assets/math-analysis-a-midterm-solutions.js"></script>
  <script>
  const qs=[
    ['求极限','\\(\\displaystyle\\lim_{n\\to\\infty}\\left(\\frac1{3n+1}+\\frac1{3n+2}+\\cdots+\\frac1{4n}\\right)\\)。','\\(\\displaystyle\\boxed{\\ln\\frac43}\\)','黎曼和与定积分','令 \\(k=1,\\ldots,n\\)，原式为 \\(\\frac1n\\sum_{k=1}^n\\frac1{3+k/n}\\)。这是 \\(f(t)=1/(3+t)\\) 在 \\([0,1]\\) 上的黎曼和，因此极限为 \\(\\int_0^1\\frac{dt}{3+t}=\\ln\\frac43\\)。'],
    ['求极限','\\(\\displaystyle\\lim_{n\\to\\infty}\\sqrt[n]{\\frac{(2n)!}{(n!)^2}}\\)。','\\(\\boxed4\\)','二项式系数与夹逼定理','记 \\(C_n=\\binom{2n}{n}\\)。由 \\(4^n=\\sum_{k=0}^{2n}\\binom{2n}{k}\\)，且中间项最大，得 \\(C_n\\le4^n\\)；又所有 \\(2n+1\\) 项均不超过最大项，故 \\(C_n\\ge4^n/(2n+1)\\)。于是 \\(4/(2n+1)^{1/n}\\le\\sqrt[n]{C_n}\\le4\\)，夹逼即得答案。'],
    ['求极限','\\(\\displaystyle\\lim_{x\\to0}\\frac{1-\\cos x\\sqrt{\\cos2x}\\sqrt[3]{\\cos3x}}{x^2}\\)。','\\(\\boxed3\\)','等价无穷小与二阶展开','当 \\(x\\to0\\) 时，\\(\\cos x=1-\\frac{x^2}{2}+o(x^2)\\)，\\(\\sqrt{\\cos2x}=1-x^2+o(x^2)\\)，\\(\\sqrt[3]{\\cos3x}=1-\\frac32x^2+o(x^2)\\)。三者相乘为 \\(1-3x^2+o(x^2)\\)，代回即得极限为 \\(3\\)。'],
    ['求极限','\\(\\displaystyle\\lim_{x\\to1}\\frac{(1-\\sqrt{x})(1-\\sqrt[3]{x})\\cdots(1-\\sqrt[n]{x})}{(1-x)^{n-1}}\\)。','\\(\\displaystyle\\boxed{\\frac1{n!}}\\)','因式分解与可去型极限','对 \\(k=2,\\ldots,n\\)，有 \\(1-x=(1-x^{1/k})(1+x^{1/k}+\\cdots+x^{(k-1)/k})\\)。故原式等于 \\(\\prod_{k=2}^n\\frac{1-x^{1/k}}{1-x}\\)。令 \\(x\\to1\\)，第 \\(k\\) 项极限为 \\(1/k\\)，故结果为 \\(\\prod_{k=2}^n1/k=1/n!\\)。'],
    ['证明题','设 \\(x_1=-2\\)，且 \\(\\displaystyle x_{n+1}=\\frac{x_n}{2}+\\frac2{x_n}\\)。证明数列 \\(\\{x_n\\}\\) 收敛，并求其极限。','\\(\\boxed{\\lim_{n\\to\\infty}x_n=-2}\\)','递推数列与数学归纳法','先算出 \\(x_2=(-2)/2+2/(-2)=-2\\)。若 \\(x_n=-2\\)，则 \\(x_{n+1}=(-2)/2+2/(-2)=-2\\)。由数学归纳法，\\(x_n=-2\\) 对每个 \\(n\\) 都成立；它是常数列，故收敛，极限为 \\(-2\\)。'],
    ['证明题','设 \\(f(x)=a_1\\sin x+a_2\\sin2x+\\cdots+a_n\\sin nx\\)，对任意 \\(x\\in\\mathbb R\\) 都有 \\( |f(x)|\\le|\\sin x|\\)。证明 \\(\\displaystyle |a_1+2a_2+\\cdots+na_n|\\le1\\)。','\\(\\displaystyle\\boxed{|a_1+2a_2+\\cdots+na_n|\\le1}\\)','函数不等式、极限的保号性','当 \\(x\\ne k\\pi\\) 时，原不等式两侧除以 \\(|\\sin x|\\)，得到 \\(\\left|\\sum_{k=1}^na_k\\frac{\\sin kx}{\\sin x}\\right|\\le1\\)。令 \\(x\\to0\\)。因为 \\(\\displaystyle\\lim_{x\\to0}\\frac{\\sin kx}{\\sin x}=k\\)，且有限和可逐项取极限，左端趋于 \\(\\left|\\sum_{k=1}^nka_k\\right|\\)。不等式在极限下保持成立，故结论成立。'],
    ['证明题','设 \\(f(2x)=f(x)\\) 对一切 \\(x\\in(0,+\\infty)\\) 成立，且 \\(\\displaystyle\\lim_{x\\to+\\infty}f(x)=A\\)。证明 \\(f(x)\\equiv A\\)。','\\(\\boxed{f(x)\\equiv A\\quad(x>0)}\\)','函数方程与无穷远处极限','任取 \\(x_0>0\\)。由 \\(f(2x)=f(x)\\) 反复迭代，\\(f(2^mx_0)=f(x_0)\\) 对所有正整数 \\(m\\) 成立。但 \\(2^mx_0\\to+\\infty\\)，故由已知极限，\\(f(2^mx_0)\\to A\\)。左侧是恒等于 \\(f(x_0)\\) 的常数列，于是 \\(f(x_0)=A\\)。因 \\(x_0\\) 任意，故 \\(f\\equiv A\\)。']
  ].map((x,i)=>({id:i+1,g:x[0],q:x[1],ans:x[2],point:x[3],why:x[4],solution:window.MathAnalysisAMidtermSolutions[i]}));
  let filter='全部',done=JSON.parse(localStorage.getItem('caigou-maa-midterm-done')||'{}'),draft=JSON.parse(localStorage.getItem('caigou-maa-midterm-draft')||'{}');const $=x=>document.getElementById(x),groups=['全部','求极限','证明题'];
  function save(){localStorage.setItem('caigou-maa-midterm-done',JSON.stringify(done));localStorage.setItem('caigou-maa-midterm-draft',JSON.stringify(draft))}
  function typesetMath(){if(!window.renderMathInElement)return;window.renderMathInElement($('list'),{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false})}
  function render(){const arr=qs.filter(x=>filter==='全部'||x.g===filter);$('tabs').innerHTML=groups.map(g=>`<button class="tab ${filter===g?'active':''}" onclick="setF('${g}')">${g}</button>`).join('');$('list').innerHTML=arr.map(card).join('');update();typesetMath()}
  function card(x){const long=x.g==='证明题';return `<article class="card ${done[x.id]?'done':''}"><div class="head"><span class="num">${x.id}</span><div class="q"><small style="color:#6b9074">${x.g}</small><br>${x.q}</div></div><div class="work"><${long?'textarea':'input'} class="input" ${long?'':'type="text"'} placeholder="先写下你的答案，再查看解析" oninput="draft[${x.id}]=this.value;save()">${long?(draft[x.id]||''):''}</${long?'textarea':'input'}><div class="actions"><button class="primary" onclick="finish(${x.id})">完成本题</button><button class="ghost" onclick="show(${x.id})">查看解析</button></div><div class="sol" id="s${x.id}">${window.CaigouRichSolution.render(x.solution,x.ans)}</div></div></article>`}
  function setF(g){filter=g;render()}function finish(i){if(!draft[i]){alert('先写下你的答案吧。');return}done[i]=true;save();render()}function show(i){$('s'+i).classList.add('show')}function update(){const n=Object.keys(done).length,l=Math.min(3,Math.floor(n/2));$('score').textContent=`${n} / 7`;$('pc').textContent=`${n} / 7`;$('bar').style.width=`${n/7*100}%`;const a=['复习刚开始','菜狗露头啦','快到岸边了','期中过关，菜狗上岸！'],b=['先从第一题开始吧！','再做一题，水位继续降！','就差一点点，捞住它！','太好了，菜狗安全上岸！'];$('pt').textContent=a[l];$('bubble').textContent=b[l];$('label').textContent=`${a[l]} · ${n} / 7`;$('sprite').style.setProperty('--x',`${-25*l}%`)}window.setF=setF;window.finish=finish;window.show=show;render();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(document.body, {
        delimiters: [
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    });
  </script>
</body>
