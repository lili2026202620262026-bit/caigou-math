      ['半径为 \\(\\sqrt2\\) 的半圆弧 \\(AB\\) 上取点 \\(P\\)，以 \\(AP\\) 为直径作半圆，阴影为月牙 \\(AP\\)。将弧 \\(AB\\) 作 \\(2k+1\\) 等分，月牙面积平均值为 \\(S_k\\)。若对任意 \\(k\\in\\mathbb N^*\\) 有 \\(\\lambda<S_k\\)，则 \\(\\lambda\\) 的最大值为','\\(\\frac1\\pi\\)','\\(\\frac2\\pi\\)','\\(\\frac12\\)','\\(1\\)']
    ];
    questions.forEach((q,i)=>{q.text=textBank[i][0];q.options=textBank[i].slice(1);q.solution=window.PLACEMENT_2024_SOLUTIONS?.[i];if(q.solution?.point)q.point=q.solution.point});
    let current=Number(localStorage.getItem('caigou-placement-current')||0);let done=JSON.parse(localStorage.getItem('caigou-placement-done')||'{}');let chosen=JSON.parse(localStorage.getItem('caigou-placement-chosen')||'{}');
    const el=id=>document.getElementById(id);const save=()=>{localStorage.setItem('caigou-placement-current',current);localStorage.setItem('caigou-placement-done',JSON.stringify(done));localStorage.setItem('caigou-placement-chosen',JSON.stringify(chosen));};
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const stepNames=['第一步','第二步','第三步','第四步','第五步','第六步'];
    function cleanConclusion(text,answer){return String(text||'').replace(new RegExp(`(?:所以|因此|故)?\\s*选择\\s*${answer}\\s*[。.]?`,'g'),'').replace(/^[，,；;。\s]+|[，,；;。\s]+$/g,'').trim()}
    function renderSolution(q){const s=q.solution||{point:q.point,lead:q.explain,steps:[],conclusion:''};const conclusion=cleanConclusion(s.conclusion,q.answer);return `<div class="analysis-label">考点分析</div><div class="analysis-point">${escapeHtml(s.point||q.point)}</div><p class="analysis-lead">${escapeHtml(s.lead||q.explain)}</p><div class="solution-title">解题步骤</div><div class="solution-steps">${(s.steps||[]).map((step,i)=>`<div class="solution-step"><span class="step-no">${i+1}</span><div class="step-copy"><b>${stepNames[i]||`第 ${i+1} 步`}：${escapeHtml(step[0])}</b><p>${escapeHtml(step[1])}</p>${step[2]?`<div class="formula">${escapeHtml(step[2])}</div>`:''}</div></div>`).join('')}</div>${conclusion?`<div class="solution-conclusion">${escapeHtml(conclusion)}</div>`:''}<div class="answer">正确答案：${escapeHtml(q.answer)}</div>`}
    function render(){current=Math.max(0,Math.min(24,current));const q=questions[current],count=Object.keys(done).length;const state=count===0?'复习刚开始':count<13?'菜狗正在上浮':count<25?'离上岸更近了':'菜狗成功获救';el('grid').innerHTML=`<div class="mobile-progress"><div class="mobile-progress-head"><span><b>${state}</b> · 当前第 ${q.no} 题</span><span>${count} / 25</span></div><div class="mobile-progress-track" aria-label="已完成 ${count} 题"><i style="width:${count/25*100}%"></i></div></div>`;el('card').innerHTML=`<div class="card-head"><span class="qno">第 ${q.no} 题</span><span class="tag">单项选择</span></div><div class="work"><div class="question-text" style="font-size:16px;font-weight:700;line-height:1.8;margin:2px 0 14px">${escapeHtml(q.text)}</div><p class="hint">先独立选择答案并提交；需要帮助时再打开解析。</p><div class="opts">${q.options.map((t,i)=>{const a='ABCD'[i];return `<button class="opt ${chosen[q.no]===a?'selected':''}" onclick="pick('${a}')"><b>${a}.</b> ${escapeHtml(t)}</button>`}).join('')}</div><div class="actions"><button class="primary" onclick="submit()">${done[q.no]?'已完成本题':'提交本题'}</button><button class="ghost" onclick="reveal()">查看解析</button></div><div class="feedback" id="feedback">${renderSolution(q)}</div><div class="move"><button onclick="go(Math.max(0,current-1))">← 上一题</button><button onclick="go(Math.min(24,current+1))">下一题 →</button></div></div>`;updatePet();window.CaigouMath?.render(el('card'))}
    function go(i){current=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}function pick(a){chosen[questions[current].no]=a;save();render();}function submit(){const n=questions[current].no;if(!chosen[n]){alert('先选一个答案，再提交吧。');return}done[n]=true;save();render();}function reveal(){el('feedback').classList.add('show');window.CaigouMath?.render(el('feedback'));}
    function updatePet(){const count=Object.keys(done).length;el('score').textContent=`${count} / 25`;const level=Math.min(3,Math.floor(count/7));el('sprite').style.setProperty('--x',`${-25*level}%`);const labels=['溺水中','冒泡中','快上岸了','捞出来啦！'];const words=['捞捞……先拿下一题！','水位下降一点，菜狗抬头了！','再坚持几题，马上靠岸。','全部完成，菜狗安全上岸！'];el('petlabel').textContent=`${labels[level]} · ${count} / 25`;el('bubble').textContent=words[level];el('pet').classList.toggle('finish',count===25);}
    window.go=go;window.pick=pick;window.submit=submit;window.reveal=reveal;render();
  </script>
