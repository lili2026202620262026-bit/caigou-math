<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜狗捞捞 · 高等代数 A（大一上期末）</title><link rel="stylesheet" href="assets/katex/katex.min.css"><script defer src="assets/katex/katex.min.js"></script><script defer src="assets/katex/contrib/auto-render.min.js"></script><script defer src="assets/caigou-katex.js"></script><style>:root{--ink:#173a2b;--deep:#347047;--bg:#f6fbf4;--line:#d6e9d5;--muted:#688577}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,7vw);position:sticky;top:0;z-index:3;background:#fffffff0;border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand i{font-style:normal;display:inline-grid;place-items:center;width:25px;height:25px;margin-right:7px;border-radius:50%;background:#bfe576;color:white;font-size:12px}.sub,.phead{font-size:12px;color:var(--muted)}main{max-width:950px;margin:auto;padding:40px 18px 165px}.hero{display:flex;justify-content:space-between;gap:18px;padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(120deg,#fff,#e7f6e3)}.eyebrow{font:700 11px monospace;color:var(--deep)}h1{font-size:clamp(28px,4.5vw,43px);margin:9px 0}.hero p{max-width:640px;margin:0;line-height:1.75;color:#587566;font-size:14px}.score{min-width:126px;padding:13px;text-align:center;border:1px solid #d8ead4;border-radius:15px;background:#fff}.score b{display:block;font-size:25px}.score span{font-size:11px;color:var(--muted)}.progress{margin:16px 0;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:14px}.phead{display:flex;justify-content:space-between;margin-bottom:7px}.phead b{color:var(--deep)}.track{height:7px;background:#e8f1e6;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#a7dc9d,#63ad71)}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#587566;background:#fff;cursor:pointer}.tab.active{color:#fff;background:var(--ink)}.list{display:grid;gap:12px}.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.card.done{border-color:#99cb92}.head{display:flex;gap:11px}.num{width:31px;height:31px;display:grid;place-items:center;flex:none;background:#eaf7e7;color:var(--deep);border-radius:9px;font:800 12px monospace}.q{font-weight:700;line-height:1.8;min-width:0}.work{margin:14px 0 0 42px}.input{width:100%;min-height:43px;padding:10px;border:1px solid #d5e6d5;border-radius:10px;font:14px/1.6 inherit}textarea.input{min-height:105px}.actions{display:flex;gap:8px;margin-top:10px}button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:var(--ink);color:#fff}.ghost{background:#eef8eb;color:var(--deep)}.sol{display:none;margin-top:12px;padding:13px;border:1px solid #cfe7ca;background:#f4fbf1;border-radius:12px;line-height:1.75}.sol.show{display:block}.pet{position:fixed;right:12px;bottom:9px;width:128px;z-index:5;pointer-events:none}.bubble{position:absolute;left:50%;top:-37px;transform:translateX(-50%);width:138px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-size:11px}.frame{height:122px;overflow:hidden}.sprite{width:400%;max-width:none;transform:translateX(var(--x,0%));transition:.5s}.label{text-align:center;font-size:10px;color:#538060}@media(max-width:650px){.sub{display:none}main{padding:24px 12px 155px}.hero{display:block;padding:20px}.score{display:inline-block;margin-top:14px}.work{margin-left:0}.pet{width:88px}.frame{height:84px}.bubble{width:102px;font-size:9px}.card{padding:15px}}</style></head><body><header class="top"><div class="brand"><i>菜</i>菜狗捞捞</div><div class="sub">高等代数 A · 大一上期末</div></header><main><section class="hero"><div><div class="eyebrow">FRESHMAN FALL · ADVANCED ALGEBRA A · FINAL</div><h1>高等代数 A，<br>和菜狗一起收尾。</h1><p>根据原始试卷照片还原，共 11 题。先独立作答，再查看考点、分步推导与严谨性说明；照片未显示完整条件的题目会明确标注。</p></div><div class="score"><b id="score">0 / 11</b><span>已完成</span></div></section><section class="progress"><div class="phead"><b id="pt">复习刚开始</b><span id="pc">0 / 11</span></div><div class="track"><i id="bar"></i></div></section><nav class="tabs" id="tabs"></nav><section class="list" id="list"></section></main><aside class="pet"><div class="bubble" id="bubble">先从第一题开始吧！</div><div class="frame"><img class="sprite" id="sprite" src="assets/caigou-drowning-states.png" alt="菜狗"></div><div class="label" id="label">溺水中</div></aside><script src="assets/caigou-rich-solutions.js"></script><script src="assets/advanced-algebra-a-final-solutions.js"></script><script>const qs=[['选择题','一个 \\(n\\) 阶矩阵有 \\(n\\) 个互异特征值，是矩阵可对角化的什么条件？','充分条件'],['选择题','矩阵 \\(A\\) 可逆且特征值为 \\(\\lambda\\)，求 \\(A^{-1}+A^{\\mathsf T}\\) 的特征值。','见严谨性说明'],['填空题','求一个向量在非标准基下的坐标。（原图未显示具体向量和基）','见解析'],['填空题','求线性变换在一组基下的矩阵。（原图未显示具体变换和基）','见解析'],['填空题','已知矩阵 \\(A\\) 可逆且特征值为 \\(2,3,4,5\\)，\\(A\\) 与 \\(B\\) 相似，求 \\(|B-E|\\)。','\\(24\\)'],['计算题','考察施密特标准正交化矩阵，将线性无关向量组化为等价的正交单位向量组。','施密特正交化公式'],['计算题','在线性空间 \\(\\mathbb R^{2\\times2}\\) 中，\\(T(X)=AX\\)，\\(A=\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}\\)。按标准基 \\(\\{E_{11},E_{12},E_{21},E_{22}\\}\\) 求 \\(T\\) 的矩阵表示。','见解析'],['计算题','同上，取 \\(F_{11}=\\begin{pmatrix}1&0\\\\0&0\\end{pmatrix},F_{12}=\\begin{pmatrix}1&1\\\\0&0\\end{pmatrix},F_{21}=\\begin{pmatrix}1&1\\\\1&0\\end{pmatrix},F_{22}=\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}\\)。求 \\(T(I)\\) 在该基下的坐标。','\\((1,-1,-2,4)^{\\mathsf T}\\)'],['计算题','求 \\(3\\) 阶全 1 矩阵 \\(J\\) 的全部特征值和全部特征向量。','见解析'],['计算题','证明：\\(J\\) 将对称矩阵正交对角化。','命题得证'],['证明题','在欧几里得空间中，向量 \\(a\\) 与一组正交基 \\(\\beta\\) 的每个向量都正交，证明 \\(a\\) 为零向量。','\\(a=0\\)']].map((x,i)=>({id:i+1,g:x[0],q:x[1],ans:x[2],solution:window.AdvancedAlgebraAFinalSolutions[i]}));let filter='全部',done=JSON.parse(localStorage.getItem('caigou-aaa-final-done')||'{}'),draft=JSON.parse(localStorage.getItem('caigou-aaa-final-draft')||'{}');const $=x=>document.getElementById(x),groups=['全部','选择题','填空题','计算题','证明题'];function save(){localStorage.setItem('caigou-aaa-final-done',JSON.stringify(done));localStorage.setItem('caigou-aaa-final-draft',JSON.stringify(draft))}function render(){let a=qs.filter(x=>filter==='全部'||x.g===filter);$('tabs').innerHTML=groups.map(g=>`<button class="tab ${filter===g?'active':''}" onclick="setF('${g}')">${g}</button>`).join('');$('list').innerHTML=a.map(card).join('');update();window.CaigouMath?.render($('list'))}function card(x){let long=x.g==='计算题'||x.g==='证明题';return `<article class="card ${done[x.id]?'done':''}"><div class="head"><span class="num">${x.id}</span><div class="q"><small style="color:#6b9074">${x.g}</small><br>${x.q}</div></div><div class="work"><${long?'textarea':'input'} class="input" placeholder="先写下你的答案，再查看解析" oninput="draft[${x.id}]=this.value;save()">${long?(draft[x.id]||''):''}</${long?'textarea':'input'}><div class="actions"><button class="primary" onclick="finish(${x.id})">提交本题</button><button class="ghost" onclick="show(${x.id})">查看解析</button></div><div class="sol" id="s${x.id}">${window.CaigouRichSolution.render(x.solution,x.ans)}</div></div></article>`}function setF(g){filter=g;render()}function finish(i){if(!draft[i])return alert('先写下你的答案吧。');done[i]=true;save();render()}function show(i){$('s'+i).classList.add('show');window.CaigouMath?.render($('s'+i))}function update(){let n=Object.keys(done).length,l=Math.min(3,Math.floor(n/3)),a=['复习刚开始','菜狗露头啦','快到岸边了','期末过关，菜狗上岸！'],b=['先从第一题开始吧！','再做一题，水位继续降！','就差一点点，捞住它！','太好了，菜狗安全上岸！'];$('score').textContent=`${n} / 11`;$('pc').textContent=`${n} / 11`;$('bar').style.width=`${n/11*100}%`;$('pt').textContent=a[l];$('bubble').textContent=b[l];$('label').textContent=`${a[l]} · ${n} / 11`;$('sprite').style.setProperty('--x',`${-25*l}%`)}window.setF=setF;window.finish=finish;window.show=show;render();</script></body></html>
