const qs=[
  ['填空题','设 \\(f(x)=x^3+x\\) 的反函数为 \\(\\varphi(x)\\)，则 \\(\\varphi^{\\prime}(2)=\\)____。','\\(\\frac14\\)','反函数求导','由 \\(f(1)=2\\)、\\(f^{\\prime}(1)=4\\)，以及 \\(\\varphi^{\\prime}(y_0)=1/f^{\\prime}(x_0)\\)，得到答案。'],
  ['填空题','函数 \\(f(x)=x^3\\) 在 \\((0,1)\\) 上满足拉格朗日中值定理的点横坐标 \\(x=\\)____。','\\(\\frac{\\sqrt3}{3}\\)','拉格朗日中值定理','由 \\(f(1)-f(0)=f^{\\prime}(x)(1-0)\\)，得到 \\(1=3x^2\\)。因为 \\(x\\in(0,1)\\)，所以 \\(x=\\sqrt3/3\\)。'],
  ['填空题','若 \\(\\displaystyle\\int f(x)\\,dx=xe^x+C\\)，求 \\(f(x)\\)。','\\((x+1)e^x\\)','不定积分与求导','对等式两边求导：\\(f(x)=(xe^x)^{\\prime}=(x+1)e^x\\)。'],
  ['填空题','求 \\(\\displaystyle\\frac{d}{dx}\\left[\\int_a^x(x-t)f(t)\\,dt\\right]\\)。','\\(\\displaystyle\\int_a^x f(t)\\,dt\\)','变上限积分求导','先写成 \\(x\\int_a^x f(t)\\,dt-\\int_a^x tf(t)\\,dt\\)，再分别求导，含有 \\(xf(x)\\) 的两项相消。'],
  ['证明题','对任意正数 \\(a,b,p,q\\)，若 \\(\\displaystyle\\frac1p+\\frac1q=1\\)，证明 \\(\\displaystyle ab\\le\\frac1pa^p+\\frac1qb^q\\)。','构造 \\(g(t)=\\ln t\\)。由 Jensen 不等式，\\(\\displaystyle\\ln\\!\\left(\\frac1pa^p+\\frac1qb^q\\right)\\ge\\frac1p\\ln a^p+\\frac1q\\ln b^q=\\ln(ab)\\)。再由 \\(\\ln t\\) 单调递增得到结论。','Jensen 不等式','关键是把权重 \\(1/p,1/q\\) 与条件相对应。'],
  ['证明题','设 \\(f(x)\\) 在 \\([a,b]\\) 上连续、在 \\((a,b)\\) 内可导，且 \\(a>0\\)、\\(af(b)=bf(a)\\)。证明存在 \\(t\\in(a,b)\\)，使 \\(tf^{\\prime}(t)=f(t)\\)。','令 \\(F(x)=f(x)/x\\)。由端点条件得 \\(F(a)=F(b)\\)，根据罗尔定理，存在 \\(t\\in(a,b)\\) 使 \\(F^{\\prime}(t)=0\\)，即 \\(\\bigl(tf^{\\prime}(t)-f(t)\\bigr)/t^2=0\\)。','罗尔定理与辅助函数','把端点条件转化为辅助函数的同值条件。'],
  ['计算题','求 \\(f(x)=(x^2-1)e^x\\) 的十阶导数。','\\((x^2+20x+89)e^x\\)','高阶导数','使用莱布尼兹公式。因为多项式 \\(x^2-1\\) 的三阶及以上导数为 \\(0\\)，只需保留前三项。'],
  ['计算题','求 \\(\\displaystyle\\lim_{x\\to0}\\frac{(1+x)^{1/x}-e}{x}\\)。','\\(-\\frac e2\\)','等价无穷小与泰勒展开','将 \\((1+x)^{1/x}\\) 写成指数形式，并保留关于 \\(x\\) 的一阶项。'],
  ['计算题','求 \\(\\displaystyle\\int\\frac{dx}{\\sqrt{x}+1}\\)。','\\(2\\sqrt{x}-2\\ln(\\sqrt{x}+1)+C\\)','换元积分','令 \\(t=\\sqrt{x}\\)，则 \\(dx=2t\\,dt\\)，原积分化为 \\(\\int 2t/(t+1)\\,dt\\)。'],
  ['计算题','用定积分法求 \\(\\displaystyle\\lim_{n\\to\\infty}\\sum_{k=1}^n\\frac1{\\sqrt{4n^2-k^2}}\\)。','\\(\\frac\\pi6\\)','定积分定义','原式可写为 \\(\\displaystyle\\frac1n\\sum_{k=1}^n\\frac1{\\sqrt{4-(k/n)^2}}\\)，它是函数 \\(1/\\sqrt{4-x^2}\\) 在 \\([0,1]\\) 上的黎曼和。'],
  ['计算题','求 \\(\\displaystyle\\int_0^{\\pi^2}\\sin\\sqrt{x}\\,dx\\)。','\\(2\\pi\\)','换元与分部积分','令 \\(t=\\sqrt{x}\\)，原式化为 \\(2\\int_0^\\pi t\\sin t\\,dt\\)，再作分部积分。'],
  ['计算题','求 \\(\\displaystyle\\int_{-2}^2\\bigl(x^3\\cos x+|x^3|\\bigr)\\,dx\\)。','\\(8\\)','奇偶性与定积分','\\(x^3\\cos x\\) 是奇函数，在对称区间上的积分为 \\(0\\)；\\(|x^3|\\) 是偶函数，因此原积分为 \\(2\\int_0^2x^3\\,dx=8\\)。']

pt').textContent=a[l];$('bubble').textContent=b[l];$('label').textContent=`${a[l]} · ${n} / 12`;$('sprite').style.setProperty('--x',`${-25*l}%`)}window.setF=setF;window.finish=finish;window.show=show;render();
</script></body></html>
