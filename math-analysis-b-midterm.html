    .pet{--offset:0%;position:fixed;right:18px;bottom:16px;width:158px;z-index:8;filter:drop-shadow(0 10px 13px rgba(58,102,66,.15));user-select:none}.pet-bubble{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:13px;padding:8px 10px;font-size:11px;line-height:1.45;position:absolute;left:50%;top:-36px;width:142px;transform:translateX(-50%);text-align:center;box-shadow:0 7px 18px rgba(44,83,54,.08)}.pet-bubble:after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}.pet-stage{position:absolute;right:2px;top:3px;z-index:2;border:1px solid #cfe5ca;background:#f8fff5;color:#4d8152;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800;box-shadow:0 3px 9px rgba(70,110,71,.09)}.sprite-frame{height:153px;width:158px;overflow:hidden;position:relative}.sprite{position:absolute;width:400%;max-width:none;height:auto;left:0;bottom:-25px;transform:translateX(var(--offset));transition:transform .55s cubic-bezier(.22,.8,.25,1);will-change:transform}.pet.celebrate .sprite-frame{animation:bounce .65s ease infinite alternate}.pet-label{margin-top:-6px;text-align:center;font:700 11px "DM Mono",monospace;color:#578265;background:rgba(245,250,243,.88);border-radius:99px;padding:4px 7px}@keyframes bounce{to{transform:translateY(-7px) rotate(-1.5deg)}} 
    @media(max-width:720px){
      .topbar{height:62px;padding:0 16px}.brand{font-size:17px}.brand b{width:24px;height:24px;margin-right:6px}.term{display:none}

      .toolbar{display:block;margin:0 0 13px}.toolbar h2{font-size:18px;margin-bottom:11px}.count{font-size:11px;white-space:nowrap}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.filter{padding:8px 4px;font-size:12px;text-align:center}
      .questions{gap:10px}.question{border-radius:15px;padding:16px 14px}.q-head{gap:9px}.num{width:29px;height:29px;border-radius:9px;font-size:12px}.q-title{font-size:15px;line-height:1.65;padding-top:0}.tag{display:none}.answer-zone{padding-left:0;margin-top:12px}.options{display:grid;grid-template-columns:1fr;gap:7px}.option{width:100%;min-width:0;padding:10px 12px;font-size:13px;line-height:1.45}.text-answer{min-height:110px;font-size:14px;padding:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.submit,.reveal{width:100%;min-height:40px;padding:8px 6px;font-size:12px}.result{padding:12px;margin-top:12px}.result p{font-size:13px;line-height:1.68}
      .pet{right:7px;bottom:8px;width:116px;pointer-events:none}.sprite-frame{width:116px;height:113px}.sprite{bottom:-18px}.pet-bubble{width:122px;top:-37px;font-size:10px;padding:6px 8px}.pet-stage{font-size:9px;padding:3px 6px;right:-1px;top:3px}.pet-label{font-size:9px;margin-top:-5px;padding:3px 4px;white-space:nowrap}
    }
    @media(max-width:360px){.hero h1{font-size:31px}.filters{grid-template-columns:1fr}.filter{padding:8px}.actions{grid-template-columns:1fr}.pet{transform:scale(.9);transform-origin:right bottom;right:0}.q-title{font-size:14px}}
  </style>

<body>
  <header class="topbar"><div class="brand"><b>菜</b>菜狗捞捞</div><div class="term">2025 秋季 · 数学分析 B</div></header>
  <main>
    <section class="hero"><div><div class="eyebrow">MATH ANALYSIS · MIDTERM SURVIVAL KIT</div><h1>先做题，<em>再捞菜狗。</em></h1><p class="lead">来自 2025 年秋季数学分析 B 的期中题库。每题先独立作答；卡住时再打开答案与考点解析。答完一题，右下角的菜狗就离岸边更近一点。</p></div><aside class="hero-card"><strong id="hero-status">菜狗正在努力露头</strong><p id="hero-copy">完成一题，水位下降一格。不要让它在极限里无限下沉。</p><div class="progress"><i id="bar"></i></div></aside></section>
    <div class="toolbar"><h2>试卷题库 <span class="count" id="counter">0 / 10 已作答</span></h2><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="choice">选择题</button><button class="filter" data-filter="proof">解答题</button></div></div>
    <section class="questions" id="questions"></section>
  </main>
  <aside class="pet" id="pet">
    <div class="pet-bubble" id="pet-text">捞捞……先拿下一题！</div>
    <div class="pet-stage" id="pet-stage">捞捞</div>
    <div class="sprite-frame"><img class="sprite" src="assets/caigou-drowning-states.png" alt="随答题进度获救的菜狗"></div>
    <div class="pet-label" id="pet-label">溺水中 · 0 / 10</div>
  </aside>
  <script>
  const data=[
    {type:'choice',tag:'数列极限',q:'下列说法正确的是（ ）',opts:['数列 \\(\\{a_n\\}\\) 收敛的充要条件是 \\(\\{a_{2n-1}\\}\\) 与 \\(\\{a_{2n}\\}\\) 均收敛且极限相等','单调递减有界数列必有下确界，反之成立','对任意 \\(\\varepsilon>0\\)，若有无穷多个 \\(n\\) 满足 \\(|x_n|<\\varepsilon\\)，则 \\(\\{x_n\\}\\) 为无穷小数列','\\(\\displaystyle\\lim_{n\\to\\infty}\\frac1{\\sqrt[n]{n!}}=+\\infty\\)'],ans:0,point:'数列收敛的子列判别与无穷小定义',explain:'奇、偶子列均收敛且极限相等时，原数列收敛，所以 A 正确。B 的逆命题不成立；C 只说明存在趋于 \\(0\\) 的子列；D 中 \\(\\sqrt[n]{n!}\\to+\\infty\\)，故其倒数趋于 \\(0\\)，并非 \\(+\\infty\\)。'},
    {type:'choice',tag:'无穷小',q:'当 \\(x\\to0\\) 时，\\(\\displaystyle\\frac1{x^2}\\sin\\frac1x\\) 是（ ）',opts:['无穷小','有界的，不是无穷小','无穷大','无界，但不是无穷大'],ans:3,point:'函数极限与无界、无穷大的区分',explain:'取 \\(x_n=1/(\\pi/2+2n\\pi)\\) 时，函数值 \\(1/x_n^2\\to+\\infty\\)；取 \\(y_n=1/(3\\pi/2+2n\\pi)\\) 时，函数值 \\(-1/y_n^2\\to-\\infty\\)。因此函数无界，但不趋于同一个无穷方向。'},
    {type:'choice',tag:'等价无穷小',q:'当 \\(x\\to0\\) 时，下列无穷小量中与其他三个不同阶的是（ ）',opts:['\\(\\ln(1+x)\\)','\\(e^x-1\\)','\\(\\tan x-\\sin x\\)','\\(1-\\cos x\\)'],ans:2,point:'等价无穷小与泰勒展开',explain:'有 \\(\\ln(1+x)\\sim x\\)、\\(e^x-1\\sim x\\)、\\(1-\\cos x\\sim x^2/2\\)，而 \\(\\tan x-\\sin x\\sim x^3/2\\)。其中 C 是三阶无穷小，与其余各项的阶数不同。'},
    {type:'choice',tag:'间断点',q:'设 \\(\\displaystyle f(x)=\\arctan\\frac1{1-x}\\)，则 \\(x=1\\) 是（ ）间断点',opts:['可去','无穷','跳跃','振荡'],ans:2,point:'左右极限与间断点分类',explain:'当 \\(x\\to1^-\\) 时，\\(1/(1-x)\\to+\\infty\\)，故 \\(f(x)\\to\\pi/2\\)；当 \\(x\\to1^+\\) 时，\\(f(x)\\to-\\pi/2\\)。左右极限均有限但不相等，所以是跳跃间断点。'},
    {type:'choice',tag:'连续函数',q:'函数 \\(\\displaystyle f(x)=\\frac{x}{a+e^{bx}}\\) 在 \\(\\mathbb R\\) 上连续，且 \\(\\displaystyle\\lim_{x\\to-\\infty}f(x)=0\\)，则下列说法正确的是（ ）',opts:['\\(a<0,\\ b<0\\)','\\(a\\ge0,\\ b>0\\)','\\(a<0,\\ b>0\\)','\\(a\\ge0,\\ b<0\\)'],ans:3,point:'连续性条件与无穷远处极限',explain:'要使函数在 \\(\\mathbb R\\) 上连续，分母必须恒不为零。再结合 \\(x\\to-\\infty\\) 时极限为 \\(0\\)，可得 \\(b<0\\) 且 \\(a\\ge0\\)，故选 D。'},
    {type:'proof',tag:'ε–δ 证明',q:'用定义证明：\\(\\displaystyle\\lim_{x\\to1}\\frac{x^2-1}{2x^2-x-1}=\\frac23\\)。',point:'函数极限的 ε–δ 定义；分母估计',explain:'对 \\(x\\ne1\\)，有 \\(\\left|\\frac{x^2-1}{2x^2-x-1}-\\frac23\\right|=\\frac{|x-1|}{3|2x+1|}\\)。若 \\(|x-1|<1\\)，则 \\(0<x<2\\)，从而 \\(|2x+1|>1\\)。所以原式小于 \\(|x-1|/3\\)。取 \\(\\delta=\\min\\{1,3\\varepsilon\\}\\) 即可。'},
    {type:'proof',tag:'柯西准则',q:'叙述柯西收敛准则，并用它证明数列 \\(\\displaystyle a_n=1+\\frac1{2^2}+\\frac1{3^2}+\\cdots+\\frac1{n^2}\\) 收敛。',point:'数列柯西收敛准则；裂项放缩',explain:'柯西准则为：对任意 \\(\\varepsilon>0\\)，存在 \\(N\\)，当 \\(m,n>N\\) 时有 \\(|a_m-a_n|<\\varepsilon\\)。若 \\(m>n\\)，则 \\(\\displaystyle |a_m-a_n|=\\sum_{k=n+1}^m\\frac1{k^2}<\\sum_{k=n+1}^m\\frac1{k(k-1)}=\\frac1n-\\frac1m<\\frac1n\\)。取 \\(N>1/\\varepsilon\\) 即得。'},
    {type:'proof',tag:'极限计算',q:'计算 \\(\\displaystyle\\lim_{x\\to0^+}\\frac{1-\\sqrt{\\cos x}}{x(1-\\cos\\sqrt{x})}\\)。',point:'等价无穷小；复合函数极限',explain:'当 \\(x\\to0^+\\) 时，\\(1-\\sqrt{\\cos x}\\sim(1-\\cos x)/2\\sim x^2/4\\)，且 \\(1-\\cos\\sqrt{x}\\sim x/2\\)。因此分母等价于 \\(x^2/2\\)，所求极限为 \\(1/2\\)。'},
    {type:'proof',tag:'函数极限',q:'叙述函数极限的归结原则，并证明极限 \\(\\displaystyle\\lim_{x\\to0}\\sin\\frac1x\\) 不存在。',point:'函数极限的归结原则；反例数列',explain:'取 \\(x_n=1/(2n\\pi)\\)，则 \\(x_n\\to0\\) 且 \\(\\sin(1/x_n)=0\\)；再取 \\(y_n=1/(2n\\pi+\\pi/2)\\)，则 \\(y_n\\to0\\) 且 \\(\\sin(1/y_n)=1\\)。两条趋于 \\(0\\) 的数列对应的函数值极限不同，由归结原则知原极限不存在。'},
    {type:'proof',tag:'上确界',q:'设 \\(S\\) 为有界数集。证明：若 \\(\\sup S=a\\notin S\\)，则存在严格递增数列 \\(\\{x_n\\}\\subset S\\)，使 \\(\\displaystyle\\lim_{n\\to\\infty}x_n=a\\)。',point:'上确界定义；递推构造；夹逼准则',explain:'先取 \\(a-1<x_1<a\\)。递推时令 \\(\\varepsilon_n=\\min\\{1/n,a-x_{n-1}\\}\\)。由上确界定义可取 \\(x_n\\in S\\)，使 \\(a-\\varepsilon_n<x_n<a\\)，于是 \\(x_n>x_{n-1}\\) 且 \\(a-1/n<x_n<a\\)。由夹逼定理得 \\(x_n\\to a\\)。'}
  ];
  const root=document.querySelector('#questions'), done=new Set(); let selected={};
  const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;');
  function draw(filter='all'){root.innerHTML=data.map((d,i)=>`<article class="question ${done.has(i)?'done':''}" data-type="${d.type}" ${filter!=='all'&&filter!==d.type?'hidden':''}><div class="q-head"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="q-title">${d.q}</div><span class="tag">${d.tag}</span></div><div class="answer-zone">${d.type==='choice'?`<div class="options">${d.opts.map((o,n)=>`<button class="option ${selected[i]===n?'selected':''}" onclick="pick(${i},${n})">${'ABCD'[n]} · ${esc(o)}</button>`).join('')}</div>`:`<textarea class="text-answer" placeholder="在这里写下你的证明或计算过程…" oninput="typed(${i},this.value)">${selected[i]||''}</textarea>`}<div class="actions"><button class="submit" onclick="submit(${i})">提交本题</button><button class="reveal" onclick="reveal(${i})">做不出来，查看答案 →</button></div><div class="result" id="result-${i}"><strong id="result-title-${i}"></strong><p><b>考点：</b>${d.point}</p><p class="analysis"><b>答案与解析：</b>${d.explain}</p></div></div></article>`).join('');window.CaigouMath?.render(root)}
  window.pick=(i,n)=>{selected[i]=n;draw(current)};window.typed=(i,v)=>selected[i]=v;
  window.submit=i=>{if(data[i].type==='choice'&&selected[i]===undefined){alert('先选择一个选项吧。');return}if(data[i].type==='proof'&&!selected[i]?.trim()){alert('先写下一点思路吧。');return}done.add(i);show(i,data[i].type==='choice'?(selected[i]===data[i].ans?'回答正确！菜狗上浮了一点。':'已记录作答。对照解析再捞一次菜狗吧。'):'已记录作答。对照解析补全证明。');sync();draw(current);show(i,data[i].type==='choice'?(selected[i]===data[i].ans?'回答正确！菜狗上浮了一点。':'已记录作答。对照解析再捞一次菜狗吧。'):'已记录作答。对照解析补全证明。')};window.reveal=i=>{show(i,'参考答案已展开。');};
  function show(i,title){let r=document.querySelector('#result-'+i);if(!r)return;r.classList.add('show');document.querySelector('#result-title-'+i).textContent=title}
  function sync(){let n=done.size,p=n/data.length,state=n===10?3:n>=6?2:n>=3?1:0,stage=n===10?'老师':n>=3?'菜菜':'捞捞';document.querySelector('#counter').textContent=`${n} / ${data.length} 已作答`;document.querySelector('#bar').style.width=(p*100)+'%';let label=n===10?'安全上岸 · 10 / 10':n>=6?'正在爬缸 · '+n+' / 10':n>=3?'努力上浮 · '+n+' / 10':'溺水求捞 · '+n+' / 10';document.querySelector('#pet-label').textContent=label;document.querySelector('#pet-stage').textContent=stage;document.querySelector('#pet-text').textContent=n===10?'老师！这次真的被捞出来啦！':n>=6?'看到岸了，再答几题！':n>=3?'菜菜正在努力上浮！':'捞捞……先拿下一题！';document.querySelector('#hero-status').textContent=n===10?'恭喜，菜狗安全上岸！':n?'菜狗正在上浮':'菜狗正在努力露头';document.querySelector('#hero-copy').textContent=n===10?'本套题已全部完成，期中周平安度过。':'完成一题，菜狗会进入新的获救状态。';let pet=document.querySelector('#pet');pet.style.setProperty('--offset',`${-state*25}%`);pet.classList.toggle('celebrate',n===10)}
  let current='all';document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{current=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));draw(current)});draw();sync();
  </script>
