  <style>
    :root{--ink:#173a2b;--deep:#347047;--green:#71b875;--bg:#f6fbf4;--line:#d6e9d5;--muted:#688577}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}.top{height:64px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,7vw);background:#ffffffeb;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-weight:800;font-size:18px}.brand i{font-style:normal;display:inline-grid;place-items:center;width:25px;height:25px;margin-right:7px;border-radius:50%;background:#bfe576;color:#fff;font-size:12px}.sub{font-size:12px;color:var(--muted)}main{max-width:980px;margin:auto;padding:40px 18px 170px}.hero{padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(125deg,#fff,#e8f6e4);display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font:700 11px monospace;letter-spacing:.7px;color:var(--deep)}h1{margin:9px 0;font-size:clamp(28px,4.5vw,44px);letter-spacing:-1.8px}.hero p{margin:0;max-width:650px;line-height:1.75;color:#587566;font-size:14px}.score{flex:none;padding:13px 15px;min-width:130px;text-align:center;border:1px solid #d8ead4;background:#fff;border-radius:15px}.score b{display:block;font-size:25px}.score span{font-size:11px;color:var(--muted)}.progress{margin:16px 0;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:14px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.progress-head b{color:var(--deep)}.track{height:7px;border-radius:99px;background:#e9f2e7;overflow:hidden}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#a8dc9e,#62ad72);transition:.35s}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid var(--line);white-space:nowrap;border-radius:99px;padding:8px 13px;background:#fff;color:#587566;font-size:13px;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card.done{border-color:#9dce96;background:#fdfffc}.head{display:flex;gap:11px;align-items:flex-start}.num{display:grid;place-items:center;flex:none;width:31px;height:31px;border-radius:9px;background:#ebf7e8;color:var(--deep);font:800 12px monospace}.q{font-weight:700;line-height:1.75;flex:1}.answer-area{margin:14px 0 0 42px}.text{width:100%;padding:10px 11px;border:1px solid #d5e6d5;border-radius:10px;outline:none;color:var(--ink)}textarea.text{min-height:100px;resize:vertical;line-height:1.6}.text:focus{border-color:var(--green);box-shadow:0 0 0 3px #e5f5e1}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{padding:10px;border:1px solid #d5e6d5;border-radius:10px;background:#fff;text-align:left;cursor:pointer;color:#3f6550}.choice.selected{background:#e4f5e0;border-color:var(--deep);color:var(--deep);font-weight:700}.actions{display:flex;gap:8px;margin-top:10px}.primary,.ghost{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px}.primary{background:var(--ink);color:#fff}.ghost{background:#eef8eb;color:var(--deep)}.solution{display:none;margin-top:12px;padding:13px;border:1px solid #cfe7ca;background:#f4fbf1;border-radius:12px;line-height:1.7;font-size:14px}.solution.show{display:block}.solution b{color:var(--deep)}pre{white-space:pre-wrap;margin:9px 0 0;background:#18392b;color:#e8f7e7;padding:12px;border-radius:9px;font:13px/1.55 Consolas,monospace}.pet{position:fixed;right:12px;bottom:9px;width:128px;z-index:7;filter:drop-shadow(0 8px 12px #426b4933);user-select:none}.bubble{position:absolute;left:50%;top:-37px;transform:translateX(-50%);width:138px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-size:11px}.frame{height:122px;overflow:hidden;position:relative}.sprite{position:absolute;width:400%;max-width:none;left:0;bottom:-20px;transform:translateX(var(--x,0%));transition:.5s}.label{text-align:center;margin-top:-4px;font:700 10px monospace;color:#538060;background:#f6fbf4cc;border-radius:99px;padding:4px}@media(max-width:650px){.sub{display:none}main{padding:24px 12px 155px}.hero{display:block;padding:20px;border-radius:20px}.hero p{font-size:13px}.score{display:inline-block;margin-top:14px;text-align:left;min-width:0}.score b{display:inline;font-size:19px;margin-right:5px}.card{padding:15px;border-radius:16px}.answer-area{margin-left:0}.choices{grid-template-columns:1fr}.pet{width:88px;right:3px}.frame{height:84px}.sprite{bottom:-14px}.bubble{width:102px;top:-34px;font-size:9px}}
  </style>

<body>
<header class="top"><div class="brand"><i>菜</i>菜狗捞捞</div><div class="sub">计算机科学导论 · 大一上期末</div></header>
<main><section class="hero"><div><div class="eyebrow">COMPUTER SCIENCE · FRESHMAN FALL FINAL</div><h1>计算机科学导论，<br>带菜狗一起过期末。</h1><p>内容用于参考，不替代具体法律意见。</p></div><div class="score"><b id="score">0 / 24</b><span>已完成</span></div></section><section class="progress"><div class="progress-head"><b id="progress-text">复习刚开始</b><span id="progress-count">0 / 24</span></div><div class="track"><i id="bar"></i></div></section><nav class="tabs" id="tabs"></nav><section class="list" id="list"></section></main>
<aside class="pet" id="pet"><div class="bubble" id="bubble">菜狗在等你写第一题！</div><div class="frame"><img class="sprite" id="sprite" src="assets/caigou-drowning-states.png" alt="随进度获救的菜狗"></div><div class="label" id="label">溺水中 · 0 / 24</div></aside>
<script src="assets/caigou-rich-solutions.js"></script>
<script src="assets/computer-intro-solutions.js"></script>
<script>
const qs=[
['fill','填空题','十进制 255 对应的二进制数是____，对应的十六进制数是____。','11111111，FF'],['fill','填空题','内存地址用 8 位二进制表示，共可表示____种地址；其对应的内存最大容量是____B。','256，256'],['fill','填空题','CPU 包括运算器、存储器、____。','控制器'],['fill','填空题','进程三状态模型中，进程因等待某事件而无法在 CPU 上运行，处于____状态。','阻塞（等待）'],['fill','填空题','学生寝室所有设备通过一个兼具路由功能的光猫上网，这种网络结构是____结构。','星型'],['fill','填空题','教务服务一体化平台采用（进程间通信）的____模型。','客户机/服务器（C/S）'],['fill','填空题','SQL 中 SELECT 查询若指定数据来源的表，必须用____子句。','FROM'],['fill','填空题','Linux 系统中，删除文件的命令是____。','rm'],
['judge','判断题','哥德尔证明算法不能解决所有问题。','T'],['judge','判断题','U 盘是一种海量存储器。','T'],['judge','判断题','手机上的高通 CPU 是 RISC 架构。','T'],['judge','判断题','苹果的 macOS 操作系统源自 Linux 操作系统。','F'],['judge','判断题','WiFi 是通过电流信号传递信息。','F'],['judge','判断题','因特网就是万维网。','F'],['judge','判断题','IPv6 中每个地址是一个 128 位的十进制数。','F'],['judge','判断题','程序员可以直接访问数据库，无需通过 DBMS。','F'],['judge','判断题','单层神经网络不能解决 XOR 问题。','T'],['judge','判断题','Linux 系统中命令是大小写无关的。','F'],
['short','简答题','已知 A、B 为输入开关（0 为断开、1 为闭合），C 为灯泡状态。请写出题图中 1、2、3 对应的门电路名称，并完成 C 的真值表。','1：非门；2：异或门；3：与门。C 的四行真值依次为：1，0，0，0。'],['short','简答题','内存 A0～A7 依次存有 22、02、21、04、52、01、C0、00。基于附录 C 指令集规则，逐步解释指令执行过程，并写出寄存器 00～02 在最后一步后的数值。','2202：将内存地址 02 的数据存入寄存器 2；2104：将内存地址 04 的数据存入寄存器 1；5201：将寄存器 0、1 的数值相加，结果存入寄存器 2；C000：终止程序。请按课堂附录 C 的寄存器初始值规则核对最终寄存器。'],['short','简答题','什么是图灵测试？现在 AI 助手（如 DeepSeek）是否能通过图灵测试？请说明原因。','图灵测试是判断机器能否表现出与人类不可区分智能对话的测试；后半问为开放题，需要结合对话表现、理解能力与测试条件论证。'],
['code','程序题','补全 Python：输入原价与折扣比例，输出“原价 5.0 元，折扣价是 4.0 元”。','final_price = price * discount\nprint(f"原价 {price} 元，折扣价是 {final_price} 元")'],['code','程序题','将正整数各位数字相乘，重复直到一位数。代码两处横线分别应选什么？选项：A product+=temp%10；B product*=temp%10；C product*=temp//10；D steps=1；E steps+=product；F steps+=1。','第一空：B（product *= temp % 10）；第二空：F（steps += 1）。'],['code','程序题','编写 Python 函数，接收正整数，返回它的所有真因子，并展示调用方式。','def get_proper_factors(num):\n    factors = []\n    for i in range(1, num):\n        if num % i == 0:\n            factors.append(i)\n    return factors\n\nfactors = get_proper_factors(target)\nprint(f"真因子的和为：{sum(factors)}")']
].map((x,i)=>({id:i+1,type:x[0],group:x[1],q:x[2],ans:x[3],solution:window.ComputerIntroSolutions[i]}));
let filter='全部',done=JSON.parse(localStorage.getItem('caigou-cs-done')||'{}'),draft=JSON.parse(localStorage.getItem('caigou-cs-draft')||'{}');const groups=['全部','填空题','判断题','简答题','程序题'];const $=id=>document.getElementById(id);function save(){localStorage.setItem('caigou-cs-done',JSON.stringify(done));localStorage.setItem('caigou-cs-draft',JSON.stringify(draft))}function render(){const shown=qs.filter(x=>filter==='全部'||x.group===filter);$('tabs').innerHTML=groups.map(g=>`<button class="tab ${g===filter?'active':''}" onclick="setFilter('${g}')">${g}</button>`).join('');$('list').innerHTML=shown.map(x=>card(x)).join('');update();window.CaigouMath?.render($('list'))}function card(x){let input=x.type==='judge'?`<div class="choices">${['T','F'].map(v=>`<button class="choice ${draft[x.id]===v?'selected':''}" onclick="choose(${x.id},'${v}')">${v} · ${v==='T'?'正确':'错误'}</button>`).join('')}</div>`:x.type==='fill'?`<input class="text" value="${draft[x.id]||''}" oninput="draft[${x.id}]=this.value;save()" placeholder="输入答案，多个空可用顿号或逗号分隔">`:`<textarea class="text" oninput="draft[${x.id}]=this.value;save()" placeholder="先独立作答，再查看参考答案">${draft[x.id]||''}</textarea>`;return `<article class="card ${done[x.id]?'done':''}"><div class="head"><span class="num">${x.id}</span><div class="q"><small style="color:#6b9074;font-weight:700">${x.group}</small><br>${x.q}</div></div><div class="answer-area">${input}<div class="actions"><button class="primary" onclick="submit(${x.id})">完成本题</button><button class="ghost" onclick="reveal(${x.id})">查看答案</button></div><div class="solution" id="sol-${x.id}">${window.CaigouRichSolution.render(x.solution,x.solution.answer||x.ans)}</div></div></article>`}function setFilter(v){filter=v;render()}function choose(id,v){draft[id]=v;save();render()}function submit(id){if(!draft[id]){alert('先写下你的答案吧。');return}done[id]=true;save();render()}function reveal(id){$('sol-'+id).classList.add('show')}function update(){const n=Object.keys(done).length,level=Math.min(3,Math.floor(n/6));$('score').textContent=`${n} / 24`;$('progress-count').textContent=`${n} / 24`;$('bar').style.width=`${n/24*100}%`;$('sprite').style.setProperty('--x',`${-25*level}%`);const a=['复习刚开始','菜狗露出耳朵了','快靠岸啦','期末过关，菜狗上岸！'],b=['菜狗在等你写第一题！','继续，水位下降一点！','再做几题就能捞到它。','太好了，菜狗安全上岸！'];$('progress-text').textContent=a[level];$('bubble').textContent=b[level];$('label').textContent=`${a[level]} · ${n} / 24`}window.setFilter=setFilter;window.choose=choose;window.submit=submit;window.reveal=reveal;render();
</script></body></html>
